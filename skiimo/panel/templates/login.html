{% extends "base.html" %}
{% block title %}Iniciar sesión · Skiimo{% endblock %}

{% block body %}
<main class="min-h-screen flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">

    <!-- Brand -->
    <div class="text-center mb-8">
      <div class="inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-surface-2 ring-1 ring-border mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 17a4 4 0 01-4-4V7a4 4 0 014-4h6a4 4 0 014 4v6a4 4 0 01-4 4M9 17v4m6-4v4m-9 0h12" />
        </svg>
      </div>
      <h1 class="text-2xl font-semibold tracking-tight">Skiimo Panel</h1>
      <p class="mt-1 text-sm text-text-muted">Acceso administrativo</p>
    </div>

    <!-- Card -->
    <form method="POST" action="/login" class="rounded-2xl bg-surface ring-1 ring-border shadow-card p-6 sm:p-8 space-y-5">

      {% if error %}
      <div role="alert" aria-live="polite" class="rounded-lg bg-danger/10 ring-1 ring-danger/30 px-4 py-3 text-sm text-danger">
        {{ error }}
      </div>
      {% endif %}

      <div>
        <label for="username" class="block text-sm font-medium text-text-muted mb-2">Usuario</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          autofocus
          class="block w-full rounded-lg bg-surface-2 border-0 ring-1 ring-inset ring-border px-4 py-3 text-text placeholder-muted focus:ring-2 focus:ring-inset focus:ring-accent transition-all duration-150 outline-none"
          placeholder="admin"
        >
      </div>

      <div x-data="{ show: false }">
        <label for="password" class="block text-sm font-medium text-text-muted mb-2">Contraseña</label>
        <div class="relative">
          <input
            id="password"
            name="password"
            :type="show ? 'text' : 'password'"
            autocomplete="current-password"
            required
            class="block w-full rounded-lg bg-surface-2 border-0 ring-1 ring-inset ring-border px-4 py-3 pr-12 text-text placeholder-muted focus:ring-2 focus:ring-inset focus:ring-accent transition-all duration-150 outline-none"
            placeholder="•••••••••"
          >
          <button
            type="button"
            @click="show = !show"
            class="absolute inset-y-0 right-0 px-3 flex items-center text-text-muted hover:text-text transition-colors"
            :aria-label="show ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            :aria-pressed="show.toString()"
          >
            <svg x-show="!show" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.46 12C3.73 7.94 7.52 5 12 5c4.48 0 8.27 2.94 9.54 7-1.27 4.06-5.06 7-9.54 7-4.48 0-8.27-2.94-9.54-7z" />
            </svg>
            <svg x-show="show" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.48 0-8.27-2.94-9.54-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
            </svg>
          </button>
        </div>
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-accent hover:bg-accent-hover text-white font-medium py-3 px-4 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-surface focus:ring-accent"
      >
        Entrar
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-text-muted">
      Solo personal autorizado. Acceso registrado en auditoría.
    </p>
  </div>
</main>
{% endblock %}
