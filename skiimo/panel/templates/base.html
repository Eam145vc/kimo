<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Skiimo Panel{% endblock %}</title>

  <!-- Tailwind CSS via CDN (browser runtime) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#020617',
            surface: '#0f172a',
            'surface-2': '#1e293b',
            border: '#334155',
            muted: '#64748b',
            text: '#f8fafc',
            'text-muted': '#94a3b8',
            accent: '#22c55e',
            'accent-hover': '#16a34a',
            primary: '#3b82f6',
            'primary-hover': '#2563eb',
            danger: '#ef4444',
          },
          fontFamily: {
            sans: ['Fira Sans', 'system-ui', 'sans-serif'],
            mono: ['Fira Code', 'ui-monospace', 'monospace'],
          },
          boxShadow: {
            'card': '0 1px 3px 0 rgb(0 0 0 / 0.4), 0 1px 2px -1px rgb(0 0 0 / 0.3)',
            'card-hover': '0 4px 6px -1px rgb(0 0 0 / 0.5), 0 2px 4px -2px rgb(0 0 0 / 0.4)',
          },
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

  <style>
    body { font-family: 'Fira Sans', system-ui, sans-serif; background-color: #020617; color: #f8fafc; }
    .tabular { font-variant-numeric: tabular-nums; font-family: 'Fira Code', ui-monospace, monospace; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-bg text-text antialiased">
  {% block body %}{% endblock %}
</body>
</html>
