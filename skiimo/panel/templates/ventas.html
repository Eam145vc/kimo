{% extends "base.html" %}
{% block title %}Ventas · Esskimo{% endblock %}

{% block content %}
<div x-data="ventas()" x-init="init()">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-xl font-semibold tracking-tight">Ventas</h1>
      <p class="text-xs text-text-muted mt-0.5" x-text="total + ' facturas — Total: $' + formatMoney(totalMonto)"></p>
    </div>
    <button @click="refresh()" :disabled="loading" class="text-xs text-text-muted hover:text-accent transition-colors flex items-center gap-1.5 disabled:opacity-50 px-2 py-1.5 rounded-md hover:bg-surface-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" :class="loading ? 'animate-spin' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      <span x-text="loading ? 'Cargando…' : 'Actualizar'"></span>
    </button>
  </div>

  <!-- Filtros -->
  <div class="rounded-xl bg-surface ring-1 ring-border p-4 mb-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
      <div>
        <label class="block text-xs text-text-muted mb-1.5">Desde</label>
        <input type="date" x-model="filtros.desde" @change="loadDebounced()" class="w-full rounded-lg bg-surface-2 ring-1 ring-border px-3 py-2 text-sm text-text focus:ring-accent focus:outline-none">
      </div>
      <div>
        <label class="block text-xs text-text-muted mb-1.5">Hasta</label>
        <input type="date" x-model="filtros.hasta" @change="loadDebounced()" class="w-full rounded-lg bg-surface-2 ring-1 ring-border px-3 py-2 text-sm text-text focus:ring-accent focus:outline-none">
      </div>
      <div>
        <label class="block text-xs text-text-muted mb-1.5">Estado</label>
        <select x-model="filtros.estado" @change="loadDebounced()" class="w-full rounded-lg bg-surface-2 ring-1 ring-border px-3 py-2 text-sm text-text focus:ring-accent focus:outline-none">
          <option value="">Todos</option>
          <option value="pendiente">Pendientes (saldo &gt; 0)</option>
          <option value="pagada">Pagadas</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-text-muted mb-1.5">Buscar</label>
        <input type="text" x-model="filtros.q" @input="loadDebounced()" placeholder="Cliente, NIT, factura..." class="w-full rounded-lg bg-surface-2 ring-1 ring-border px-3 py-2 text-sm text-text placeholder-muted focus:ring-accent focus:outline-none">
      </div>
    </div>
  </div>

  <!-- Tabla -->
  <div class="rounded-xl bg-surface ring-1 ring-border overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-surface-2 text-text-muted">
          <tr>
            <th class="text-left px-4 py-3 font-medium">Factura</th>
            <th class="text-left px-4 py-3 font-medium">Fecha</th>
            <th class="text-left px-4 py-3 font-medium">Cliente</th>
            <th class="text-right px-4 py-3 font-medium">Total</th>
            <th class="text-right px-4 py-3 font-medium">Saldo</th>
            <th class="text-center px-4 py-3 font-medium">Estado</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-border/40">
          <template x-if="loading">
            <tr><td colspan="6" class="text-center py-12 text-text-muted">Cargando…</td></tr>
          </template>
          <template x-if="!loading && items.length === 0">
            <tr><td colspan="6" class="text-center py-12 text-text-muted">Sin resultados</td></tr>
          </template>
          <template x-for="row in items" :key="row.id">
            <tr @click="openDetail(row.id)" class="cursor-pointer hover:bg-surface-2/50 transition-colors">
              <td class="px-4 py-3 font-mono text-accent" x-text="row.name"></td>
              <td class="px-4 py-3 text-text-muted tabular" x-text="row.date"></td>
              <td class="px-4 py-3 text-text" x-text="row.customer_name || row.customer_ident || '—'"></td>
              <td class="px-4 py-3 text-right tabular" x-text="'$' + formatMoney(row.total)"></td>
              <td class="px-4 py-3 text-right tabular" :class="row.balance > 0 ? 'text-warning' : 'text-text-muted'" x-text="'$' + formatMoney(row.balance)"></td>
              <td class="px-4 py-3 text-center">
                <span :class="row.balance > 0 ? 'bg-warning/10 text-warning ring-warning/30' : 'bg-success/10 text-success ring-success/30'" class="inline-block px-2 py-0.5 text-xs rounded-full ring-1" x-text="row.balance > 0 ? 'Pendiente' : 'Pagada'"></span>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Paginación -->
    <div class="flex items-center justify-between px-4 py-3 border-t border-border bg-surface-2/30 text-xs">
      <p class="text-text-muted">
        <span x-text="items.length"></span> / <span x-text="total"></span>
      </p>
      <div class="flex gap-1">
        <button @click="prevPage()" :disabled="page === 1 || loading" class="px-3 py-1.5 rounded-md hover:bg-surface-2 text-text-muted disabled:opacity-40 transition-colors">← Anterior</button>
        <button @click="nextPage()" :disabled="items.length < pageSize || loading" class="px-3 py-1.5 rounded-md hover:bg-surface-2 text-text-muted disabled:opacity-40 transition-colors">Siguiente →</button>
      </div>
    </div>
  </div>

  <!-- Modal detalle -->
  <div x-show="detail" @keydown.escape.window="detail = null" style="display:none" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div @click="detail = null" class="absolute inset-0 bg-bg/80 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-2xl bg-surface ring-1 ring-border rounded-t-2xl sm:rounded-2xl shadow-card-hover max-h-[90vh] overflow-hidden flex flex-col">
      <div class="flex items-center justify-between px-5 py-4 border-b border-border">
        <div>
          <h3 class="text-base font-semibold" x-text="detail?.name || 'Factura'"></h3>
          <p class="text-xs text-text-muted" x-text="detail?.date"></p>
        </div>
        <button @click="detail = null" class="text-text-muted hover:text-text p-1" aria-label="Cerrar">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="overflow-y-auto p-5 space-y-4">
        <!-- Cliente -->
        <div>
          <p class="text-xs uppercase tracking-wider text-text-muted mb-1">Cliente</p>
          <p class="text-sm font-medium" x-text="detail?.customer_name || '—'"></p>
          <p class="text-xs text-text-muted tabular" x-text="'NIT ' + (detail?.customer_ident || '—')"></p>
        </div>
        <!-- Totales -->
        <div class="grid grid-cols-2 gap-3">
          <div class="rounded-lg bg-surface-2 p-3">
            <p class="text-xs text-text-muted">Total</p>
            <p class="text-lg font-semibold tabular" x-text="'$' + formatMoney(detail?.total || 0)"></p>
          </div>
          <div class="rounded-lg bg-surface-2 p-3">
            <p class="text-xs text-text-muted">Saldo</p>
            <p class="text-lg font-semibold tabular" :class="(detail?.balance || 0) > 0 ? 'text-warning' : 'text-success'" x-text="'$' + formatMoney(detail?.balance || 0)"></p>
          </div>
        </div>
        <!-- Items -->
        <div x-show="detail?.items && detail.items.length > 0">
          <p class="text-xs uppercase tracking-wider text-text-muted mb-2">Items</p>
          <ul class="space-y-1.5">
            <template x-for="(it, idx) in (detail?.items || [])" :key="idx">
              <li class="flex justify-between text-sm py-1.5 border-b border-border/30 last:border-0">
                <span class="text-text" x-text="(it.quantity || 0) + 'x ' + (it.description || it.code || '?')"></span>
                <span class="text-text-muted tabular" x-text="'$' + formatMoney(it.total || it.price * it.quantity || 0)"></span>
              </li>
            </template>
          </ul>
        </div>
        <!-- Pagos -->
        <div x-show="detail?.payments && detail.payments.length > 0">
          <p class="text-xs uppercase tracking-wider text-text-muted mb-2">Forma de pago</p>
          <ul class="space-y-1.5">
            <template x-for="(p, idx) in (detail?.payments || [])" :key="idx">
              <li class="flex justify-between text-sm py-1">
                <span class="text-text" x-text="p.name || ('Pago #' + (p.id || ''))"></span>
                <span class="text-text-muted tabular" x-text="'$' + formatMoney(p.value || 0)"></span>
              </li>
            </template>
          </ul>
        </div>
        <!-- Observaciones -->
        <div x-show="detail?.observations">
          <p class="text-xs uppercase tracking-wider text-text-muted mb-1">Observaciones</p>
          <p class="text-sm text-text-muted italic" x-text="detail?.observations"></p>
        </div>
      </div>

      <!-- Acciones -->
      <div class="border-t border-border bg-surface-2/30 px-5 py-3 flex flex-wrap gap-2 justify-end">
        <button @click="downloadPDF()" :disabled="!detail" class="text-xs px-3 py-2 rounded-md bg-surface-2 ring-1 ring-border hover:ring-accent/50 hover:text-accent transition-all flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
          Descargar PDF
        </button>
        <button x-show="(detail?.balance || 0) > 0" @click="cobrar()" class="text-xs px-3 py-2 rounded-md bg-accent/10 ring-1 ring-accent/30 text-accent hover:bg-accent/20 transition-all flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1"/></svg>
          Cobrar
        </button>
        <button x-show="(detail?.balance || 0) == detail?.total && detail?.total > 0" @click="anular()" class="text-xs px-3 py-2 rounded-md bg-danger/10 ring-1 ring-danger/30 text-danger hover:bg-danger/20 transition-all flex items-center gap-1.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22"/></svg>
          Anular
        </button>
      </div>
    </div>
  </div>

</div>

<script>
function ventas() {
  return {
    items: [], total: 0, totalMonto: 0, page: 1, pageSize: 50,
    filtros: { desde: '', hasta: '', estado: '', q: '' },
    loading: false, detail: null,
    _debounceTimer: null,

    init() {
      // Default: ultimo mes
      const hoy = new Date();
      const hace30 = new Date(); hace30.setDate(hace30.getDate() - 30);
      this.filtros.desde = hace30.toISOString().slice(0, 10);
      this.filtros.hasta = hoy.toISOString().slice(0, 10);
      this.load();
    },

    formatMoney(n) { if (n == null) return '—'; return Math.round(n).toLocaleString('es-CO'); },

    loadDebounced() {
      clearTimeout(this._debounceTimer);
      this._debounceTimer = setTimeout(() => { this.page = 1; this.load(); }, 300);
    },

    async load() {
      this.loading = true;
      const params = new URLSearchParams({
        page: this.page, page_size: this.pageSize,
        desde: this.filtros.desde || '', hasta: this.filtros.hasta || '',
        estado: this.filtros.estado || '', q: this.filtros.q || '',
      });
      try {
        const r = await fetch('/api/ventas?' + params.toString(), { credentials: 'same-origin' });
        if (r.ok) {
          const data = await r.json();
          this.items = data.items || [];
          this.total = data.total || 0;
          this.totalMonto = data.total_monto || 0;
        }
      } catch(e) { console.error(e); }
      finally { this.loading = false; }
    },

    refresh() { this.load(); },
    prevPage() { if (this.page > 1) { this.page--; this.load(); } },
    nextPage() { if (this.items.length >= this.pageSize) { this.page++; this.load(); } },

    async openDetail(id) {
      this.detail = { name: '...', date: '', items: [], payments: [] };
      try {
        const r = await fetch('/api/ventas/' + id, { credentials: 'same-origin' });
        if (r.ok) this.detail = await r.json();
      } catch(e) { console.error(e); }
    },

    async downloadPDF() {
      if (!this.detail) return;
      window.open('/api/ventas/' + this.detail.id + '/pdf', '_blank');
    },

    async cobrar() {
      if (!this.detail) return;
      const monto = prompt(`Monto a cobrar (saldo actual: $${this.formatMoney(this.detail.balance)})`, this.detail.balance);
      if (!monto) return;
      const metodo = prompt('Método: efectivo, nequi, daviplata, banco_ahorros, tarjeta_debito, tarjeta_credito', 'efectivo');
      if (!metodo) return;
      const r = await fetch('/api/ventas/' + this.detail.id + '/cobrar', {
        method: 'POST', headers: {'Content-Type':'application/json'}, credentials:'same-origin',
        body: JSON.stringify({ monto: parseFloat(monto), metodo }),
      });
      const data = await r.json();
      if (data.ok) {
        alert('✓ Cobro registrado: ' + (data.rc_name || 'OK'));
        this.detail = null;
        this.load();
      } else {
        alert('Error: ' + (data.error || 'desconocido'));
      }
    },

    async anular() {
      if (!this.detail) return;
      if (!confirm(`¿Anular ${this.detail.name}? Esta acción no se puede deshacer.`)) return;
      const r = await fetch('/api/ventas/' + this.detail.id + '/anular', {
        method: 'POST', credentials:'same-origin',
      });
      const data = await r.json();
      if (data.ok) { alert('✓ Anulada'); this.detail = null; this.load(); }
      else { alert('Error: ' + (data.error || '')); }
    },
  }
}
</script>
{% endblock %}
