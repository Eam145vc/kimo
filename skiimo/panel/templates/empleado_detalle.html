{% extends "base.html" %}
{% block title %}Empleado · Esskimo{% endblock %}

{% block content %}
<div x-data="empleadoDetalle({{ emp_id }})" x-init="init()">

  <!-- Volver -->
  <a href="/empleados" class="inline-flex items-center gap-1.5 text-xs text-text-muted hover:text-text transition-colors duration-200 mb-4">
    <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
    Volver a empleados
  </a>

  <template x-if="cargando">
    <div class="text-center py-20 text-text-muted text-sm">Cargando ficha…</div>
  </template>

  <template x-if="!cargando && emp">
    <div>
      <!-- ===== Cabecera: foto + datos + acciones ===== -->
      <div class="rounded-xl bg-surface ring-1 ring-border p-5 mb-4 flex items-start gap-5 flex-wrap">
        <!-- Foto / avatar -->
        <div class="flex-shrink-0">
          <template x-if="fotoEmp">
            <img :src="fotoEmp" :alt="'Foto de ' + emp.nombre"
                 class="w-20 h-20 rounded-full object-cover ring-2 ring-border">
          </template>
          <template x-if="!fotoEmp">
            <div class="w-20 h-20 rounded-full bg-surface-2 ring-2 ring-border flex items-center justify-center text-2xl font-semibold text-text-muted"
                 x-text="iniciales(emp.nombre)"></div>
          </template>
        </div>
        <!-- Datos -->
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <h1 class="text-xl font-semibold tracking-tight" x-text="emp.nombre"></h1>
            <span class="text-[11px] px-2 py-0.5 rounded-full"
                  :class="emp.activo ? 'bg-success/15 text-success' : 'bg-danger/15 text-danger'"
                  x-text="emp.activo ? 'Activo' : 'Inactivo'"></span>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-x-5 gap-y-1 mt-2 text-xs">
            <div><span class="text-text-muted">Cargo</span><p x-text="emp.cargo || '—'"></p></div>
            <div><span class="text-text-muted">Cédula</span><p class="tabular" x-text="emp.cedula || '—'"></p></div>
            <div><span class="text-text-muted">Salario mensual</span><p class="tabular" x-text="emp.salario_mensual ? fmtMoney(emp.salario_mensual) : '—'"></p></div>
            <div><span class="text-text-muted">Valor hora</span><p class="tabular" x-text="emp.valor_hora_ord ? fmtMoney(emp.valor_hora_ord) : '—'"></p></div>
          </div>
        </div>
        <!-- Acciones -->
        <div class="flex flex-col gap-2">
          <a :href="'/asistencia?empleado_id=' + emp.id" class="text-xs bg-surface-2 hover:bg-border text-text px-3 py-1.5 rounded-lg text-center transition-colors duration-200">Ver marcajes</a>
        </div>
      </div>

      <!-- Selector de rango -->
      <div class="flex items-center gap-2 mb-4 text-sm flex-wrap">
        <span class="text-xs text-text-muted">Periodo:</span>
        <button @click="setRango(30)" :class="rangoDias===30 ? 'bg-accent text-bg' : 'bg-surface ring-1 ring-border text-text-muted hover:text-text'" class="text-xs px-3 py-1.5 rounded-lg transition-colors duration-200">30 días</button>
        <button @click="setRango(15)" :class="rangoDias===15 ? 'bg-accent text-bg' : 'bg-surface ring-1 ring-border text-text-muted hover:text-text'" class="text-xs px-3 py-1.5 rounded-lg transition-colors duration-200">15 días</button>
        <button @click="setRango(90)" :class="rangoDias===90 ? 'bg-accent text-bg' : 'bg-surface ring-1 ring-border text-text-muted hover:text-text'" class="text-xs px-3 py-1.5 rounded-lg transition-colors duration-200">90 días</button>
        <span class="text-[11px] text-text-muted ml-1 tabular" x-text="rango.desde + ' → ' + rango.hasta"></span>
      </div>

      <!-- ===== KPIs ===== -->
      <!-- Fila 1: Asistencia y puntualidad -->
      <p class="text-[11px] uppercase tracking-wider text-text-muted font-medium mb-2">Asistencia y puntualidad</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Asistencia</p>
          <p class="text-2xl font-semibold tabular mt-1" :class="colorPct(kpis.pct_asistencia, true)" x-text="kpis.pct_asistencia + '%'"></p>
          <p class="text-[11px] text-text-muted mt-0.5 tabular" x-text="kpis.dias_trabajados + ' / ' + kpis.dias_esperados + ' días'"></p>
        </div>
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Llegadas tarde</p>
          <p class="text-2xl font-semibold tabular mt-1" :class="kpis.llegadas_tarde > 0 ? 'text-warning' : 'text-success'" x-text="kpis.llegadas_tarde"></p>
          <p class="text-[11px] text-text-muted mt-0.5 tabular" x-text="kpis.prom_min_tarde > 0 ? ('prom. ' + kpis.prom_min_tarde + ' min') : 'sin tardanzas'"></p>
        </div>
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Salidas tempranas</p>
          <p class="text-2xl font-semibold tabular mt-1" :class="kpis.salidas_tempranas > 0 ? 'text-warning' : 'text-success'" x-text="kpis.salidas_tempranas"></p>
          <p class="text-[11px] text-text-muted mt-0.5">en el periodo</p>
        </div>
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Días hábiles</p>
          <p class="text-2xl font-semibold tabular mt-1" x-text="kpis.dias_habiles"></p>
          <p class="text-[11px] text-text-muted mt-0.5">lun – vie</p>
        </div>
      </div>

      <!-- Fila 2: Ausentismo e incapacidades -->
      <p class="text-[11px] uppercase tracking-wider text-text-muted font-medium mb-2">Ausentismo e incapacidades</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Ausentismo</p>
          <p class="text-2xl font-semibold tabular mt-1" :class="colorPct(kpis.pct_ausentismo, false)" x-text="kpis.pct_ausentismo + '%'"></p>
          <p class="text-[11px] text-text-muted mt-0.5 tabular" x-text="kpis.ausencias + ' días ausente'"></p>
        </div>
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Incapacidad EPS</p>
          <p class="text-2xl font-semibold tabular mt-1 text-accent" x-text="kpis.dias_incapacidad"></p>
          <p class="text-[11px] text-text-muted mt-0.5">días (pagados)</p>
        </div>
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Findes trabajados</p>
          <p class="text-2xl font-semibold tabular mt-1" x-text="kpis.dias_finde_trab"></p>
          <p class="text-[11px] text-text-muted mt-0.5">sáb / dom</p>
        </div>
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Días esperados</p>
          <p class="text-2xl font-semibold tabular mt-1" x-text="kpis.dias_esperados"></p>
          <p class="text-[11px] text-text-muted mt-0.5">hábiles − incap.</p>
        </div>
      </div>

      <!-- Fila 3: Horas y pago -->
      <p class="text-[11px] uppercase tracking-wider text-text-muted font-medium mb-2">Horas y pago acumulado</p>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4">
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Horas ordinarias</p>
          <p class="text-2xl font-semibold tabular mt-1" x-text="kpis.horas_ord + ' h'"></p>
        </div>
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Horas extra</p>
          <p class="text-2xl font-semibold tabular mt-1" :class="kpis.horas_extra > 0 ? 'text-warning' : ''" x-text="kpis.horas_extra + ' h'"></p>
        </div>
        <div class="rounded-xl bg-surface ring-1 ring-border p-4">
          <p class="text-xs text-text-muted">Pagado / estimado</p>
          <p class="text-2xl font-semibold tabular mt-1 text-success" x-text="fmtMoney(kpis.pago_acum)"></p>
        </div>
      </div>

      <!-- ===== Tendencia: horas por día ===== -->
      <div class="rounded-xl bg-surface ring-1 ring-border p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold">Horas por día</h3>
          <div class="flex items-center gap-3 text-[10px] text-text-muted">
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-accent inline-block"></span>jornada completa</span>
            <span class="flex items-center gap-1"><span class="w-2 h-2 rounded-sm bg-warning inline-block"></span>parcial</span>
          </div>
        </div>
        <template x-if="!tendencia.length">
          <p class="text-xs text-text-muted py-6 text-center">Sin datos en este periodo.</p>
        </template>
        <!-- Barras horizontales: legible en cualquier ancho, con valor directo -->
        <div x-show="tendencia.length" class="space-y-1.5">
          <template x-for="d in tendencia" :key="d.fecha">
            <div class="flex items-center gap-2 text-xs">
              <span class="w-20 flex-shrink-0 text-text-muted tabular" x-text="fechaCorta(d.fecha)"></span>
              <div class="flex-1 h-5 rounded bg-surface-2 overflow-hidden relative">
                <div class="h-full rounded transition-all duration-300"
                     :class="d.horas >= 8.5 ? 'bg-accent' : 'bg-warning'"
                     :style="'width:' + Math.min(100, (d.horas / 9) * 100) + '%'"></div>
              </div>
              <span class="w-12 flex-shrink-0 text-right tabular" x-text="d.horas + ' h'"></span>
            </div>
          </template>
        </div>
      </div>

    </div>
  </template>
</div>

<script>
function empleadoDetalle(empId) {
  return {
    empId,
    cargando: true,
    emp: null,
    fotoEmp: null,
    kpis: {},
    tendencia: [],
    rango: { desde: '', hasta: '' },
    rangoDias: 30,

    async init() {
      await this.cargar();
    },

    async cargar() {
      this.cargando = true;
      const fbog = (dd) => new Intl.DateTimeFormat('en-CA', {
        timeZone: 'America/Bogota', year: 'numeric', month: '2-digit', day: '2-digit'
      }).format(dd);
      const hoy = new Date();
      const hasta = fbog(hoy);
      const d = new Date(hoy); d.setDate(d.getDate() - (this.rangoDias - 1));
      const desde = fbog(d);
      try {
        const r = await fetch(`/api/empleados/${this.empId}/perfil?desde=${desde}&hasta=${hasta}`);
        if (!r.ok) { this.cargando = false; return; }
        const j = await r.json();
        this.emp = j.empleado;
        this.kpis = j.kpis;
        this.tendencia = j.tendencia || [];
        this.rango = j.rango;
        this.fotoEmp = this.emp.foto_path || null;
      } catch (e) {}
      this.cargando = false;
    },

    setRango(dias) {
      this.rangoDias = dias;
      this.cargar();
    },

    iniciales(nombre) {
      if (!nombre) return '?';
      return nombre.split(' ').filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
    },

    fmtMoney(v) {
      const n = Number(v) || 0;
      return '$' + n.toLocaleString('es-CO', { maximumFractionDigits: 0 });
    },

    // Verde si "bueno alto" (asistencia) o "bueno bajo" (ausentismo)
    colorPct(v, altoBueno) {
      const n = Number(v) || 0;
      if (altoBueno) {
        if (n >= 95) return 'text-success';
        if (n >= 80) return 'text-warning';
        return 'text-danger';
      } else {
        if (n <= 5) return 'text-success';
        if (n <= 20) return 'text-warning';
        return 'text-danger';
      }
    },

    fechaCorta(iso) {
      // 2026-05-27 -> "mié 27/05"
      try {
        const [y, m, d] = iso.split('-');
        const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
        const dia = dias[new Date(iso + 'T00:00:00').getDay()];
        return `${dia} ${d}/${m}`;
      } catch { return iso; }
    },
  };
}
</script>
{% endblock %}
